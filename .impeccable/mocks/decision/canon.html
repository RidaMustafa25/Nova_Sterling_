<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Category standard sketch</title>
<style>
  * { box-sizing:border-box; margin:0; }
  body { width:1440px; height:900px; overflow:hidden; background:#fff; color:#111; font-family: Arial, sans-serif; }
  .bar { height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 48px; border-bottom:1px solid #e6e6e6; }
  .logo { font-weight:700; letter-spacing:.25em; font-size:14px; }
  .menu { background:#111; color:#fff; padding:10px 20px; border-radius:999px; font-size:14px; }
  .hero { height:520px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; background:#f5f5f5; }
  h1 { font-size:88px; letter-spacing:-.03em; }
  .cta { margin-top:28px; background:#111; color:#fff; padding:16px 30px; font-size:15px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:24px; padding:40px 48px; }
  .card { height:280px; background:#eee; }
</style>
</head>
<body>
  <div class="bar"><div class="logo">NOVA STERLING</div><div class="menu">Menu +</div></div>
  <div class="hero"><h1>Crafted to last.</h1><div class="cta">Shop the collection</div></div>
  <div class="grid"><div class="card"></div><div class="card"></div><div class="card"></div><div class="card"></div></div>
</body>
</html>
